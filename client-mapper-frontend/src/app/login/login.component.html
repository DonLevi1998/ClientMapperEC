<!-- Login Form -->
<h2>Login</h2>
<form (ngSubmit)="onSubmit(loginForm)" #loginForm="ngForm" novalidate>
  <label for="email">Email:</label>
  <input type="email" id="email" name="email" [(ngModel)]="email" required><br>
  <label for="password">Password:</label>
  <input type="password" id="password" name="password" [(ngModel)]="password" required><br>
  <div *ngIf="errorMessage" style="color:red">{{ errorMessage }}</div>
  <button type="submit">Login</button>
</form>

<!-- Navigation Buttons -->
<button type="button" (click)="goToCreateUser()">Create User</button>
