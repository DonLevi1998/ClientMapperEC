services:
  users-create:
    image: leviathan119/create-user:latest
    ports:
      - "5020:5020"
    restart: unless-stopped

  users-delete:
    image: leviathan119/delete-user:latest
    ports:
      - "5021:5021"
    restart: unless-stopped

  users-list-find:
    image: leviathan119/read-user:latest
    ports:
      - "5022:5022"
    restart: unless-stopped

  users-update:
    image: leviathan119/update-user:latest
    ports:
      - "5023:5023"
    restart: unless-stopped